<script>
    const API_KEY = 'DEMO_KEY';
    const BASE_URL = 'https://api.nasa.gov/planetary/apod';

    const content = document.getElementById('content');
    const form = document.getElementById('form');
    const dateInput = document.getElementById('dateInput');

    const today = new Date();
    const formattedToday = today.toISOString().split('T')[0];
    dateInput.value = formattedToday;

    const traducciones = {
        'loading': 'Cargando imagen del dia',
        'error_connect': 'Error al conectar con la API',
        'error_no_data': 'No se pudo cargar la imagen',
        'title_prefix': 'Titulo',
        'date_prefix': 'Fecha',
        'description_prefix': 'Descripcion',
        'video': 'Video'
    };

    async function getPictureOfTheDay(date) {
        try {
            let url = BASE_URL + '?api_key=' + API_KEY;
            if (date) {
                url += '&date=' + date;
            }
            
            content.innerHTML = '<div class="loading">🌀 ' + traducciones.loading + ' 🌀</div>';
            
            const res = await fetch(url);
            
            if (!res.ok) {
                content.innerHTML = '<div class="error-message">❌ ' + traducciones.error_connect + ' (' + res.status + ')</div>';
                return;
            }
            
            const data = await res.json();
            
            if (data.error) {
                content.innerHTML = '<div class="error-message">❌ ' + traducciones.error_connect + '</div>';
                return;
            }
            
            if (data && data.title) {
                showContent(data);
            } else {
                content.innerHTML = '<div class="error-message">❌ ' + traducciones.error_no_data + '</div>';
            }
        } catch (error) {
            console.error('Error:', error);
            content.innerHTML = '<div class="error-message">❌ ' + traducciones.error_connect + '</div>';
        }
    }

    function traducirTexto(texto) {
        let textoTraducido = texto;
        
        const traduccionesTexto = {
            'Galaxy': 'Galaxia',
            'Galaxies': 'Galaxias',
            'Star': 'Estrella',
            'Stars': 'Estrellas',
            'Planet': 'Planeta',
            'Planets': 'Planetas',
            'Moon': 'Luna',
            'Moons': 'Lunas',
            'Sun': 'Sol',
            'Earth': 'Tierra',
            'Space': 'Espacio',
            'Nebula': 'Nebulosa',
            'Nebulae': 'Nebulosas',
            'Cluster': 'Cumulo',
            'Clusters': 'Cumulos',
            'Comet': 'Cometa',
            'Comets': 'Cometas',
            'Asteroid': 'Asteroide',
            'Asteroids': 'Asteroides',
            'Orbit': 'Orbita',
            'Orbiting': 'Orbitando',
            'Telescope': 'Telescopio',
            'Astronaut': 'Astronauta',
            'Astronauts': 'Astronautas',
            'Rocket': 'Cohete',
            'Launch': 'Lanzamiento',
            'Mission': 'Mision',
            'Solar System': 'Sistema Solar',
            'Milky Way': 'Via Lactea',
            'Black Hole': 'Agujero Negro',
            'Black Holes': 'Agujeros Negros',
            'Supernova': 'Supernova',
            'constellation': 'constelacion',
            'constellations': 'constelaciones'
        };
        
        for (let ingles in traduccionesTexto) {
            let espanol = traduccionesTexto[ingles];
            let regex = new RegExp('\\b' + ingles + '\\b', 'gi');
            textoTraducido = textoTraducido.replace(regex, espanol);
        }
        
        return textoTraducido;
    }

    function showContent(data) {
        const title = data.title || 'Sin titulo';
        const date = data.date || 'Fecha no disponible';
        let explanation = data.explanation || 'Sin descripcion disponible';
        const mediaType = data.media_type || 'image';
        const url = data.url || '';
        const hdurl = data.hdurl || url;
        
        explanation = traducirTexto(explanation);
        
        let mediaHtml = '';
        
        if (mediaType === 'video') {
            mediaHtml = '<iframe class="video-frame" src="' + url + '" frameborder="0" allowfullscreen></iframe>';
        } else {
            mediaHtml = '<img src="' + hdurl + '" alt="' + title + '" class="nasa-image" onerror="this.src=\'' + url + '\'">';
        }
        
        content.innerHTML = 
            '<div class="nasa-title">' + title + '</div>' +
            '<div class="nasa-date">📅 ' + date + '</div>' +
            '<div class="media-container">' + mediaHtml + '</div>' +
            '<div class="nasa-explanation">' + explanation + '</div>';
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const selectedDate = dateInput.value;
        
        if (selectedDate && selectedDate !== '') {
            getPictureOfTheDay(selectedDate);
        } else {
            getPictureOfTheDay(formattedToday);
        }
    });

    getPictureOfTheDay(formattedToday);
</script>
