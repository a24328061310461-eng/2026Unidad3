    <style>
        :root{
            --color-de-fondo: #bacba9;
            --color-de-lertras: #e1f4cb;
            --color-barra: #9bae8a;
            --color-boton: #f1bf98;
            --color-extra: #3f4739;
        }

        body {
            background: linear-gradient(135deg, #8fc093 0%, #6a9c6e 100%);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        
        .dropdown-menu a {
            color: #333;
            text-decoration: none;
            display: block;
            padding: 8px 16px;
        }
        .dropdown-menu a:hover {
            background-color: #f1bf98;
            color: #1a1a2e;
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        .x-card {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border-radius: 15px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .x-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: var(--color-barra);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .card-img-container {
            height: 200px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
            color: #ddd;
        }

        .stat-label {
            font-weight: bold;
            color: var(--color-boton);
            display: inline-block;
            width: 80px;
        }

        .small {
            font-size: 12px;
            line-height: 1.4;
        }

        hr {
            border-color: #444;
        }

        .no-mutantes {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 30px;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background: var(--color-boton);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
    </style>
